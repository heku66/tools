<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XTools - UUID 生成器</title><link rel="stylesheet" href="/css/style.css"><style>.page{max-width:900px;margin:auto;padding:55px 24px 80px}.back{color:#707780;font-size:14px}.panel{margin-top:25px;background:#fff;border:1px solid #e6e8eb;border-radius:16px;padding:20px;box-shadow:0 8px 30px #1419230f}textarea,input{width:100%;border:1px solid #dfe2e6;border-radius:10px;padding:12px;outline:0;font:14px monospace}textarea{min-height:280px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{border:0;border-radius:9px;padding:10px 16px;cursor:pointer;background:#111827;color:white}button.secondary{background:#eef1f5;color:#222}.result{margin-top:14px;padding:14px;background:#f6f7f9;border-radius:10px;min-height:50px;white-space:pre-wrap;word-break:break-word;font:14px monospace}@media(max-width:700px){.page{padding-left:18px;padding-right:18px}}</style></head><body><header><div class="nav"><a class="brand" href="/">✦ XTools</a><nav><a href="/">工具</a><a href="/#about">关于</a></nav></div></header><main class="page"><a class="back" href="/">← 返回工具箱</a><h1>UUID 生成器</h1><p style="color:#707780">快速生成 UUID v4</p><div class="panel"><div class="actions"><button onclick="g(1)">生成 1 个</button><button onclick="g(10)">生成 10 个</button><button class="secondary" onclick="navigator.clipboard.writeText(o.textContent)">复制</button></div><div id="o" class="result"></div><script>function g(n){o.textContent=Array.from({length:n},()=>crypto.randomUUID()).join("\n")}g(1)</script></div></main></body></html>
