<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XTools - JSON 工具</title><link rel="stylesheet" href="/css/style.css"><style>.page{max-width:900px;margin:auto;padding:55px 24px 80px}.back{color:#707780;font-size:14px}.panel{margin-top:25px;background:#fff;border:1px solid #e6e8eb;border-radius:16px;padding:20px;box-shadow:0 8px 30px #1419230f}textarea,input{width:100%;border:1px solid #dfe2e6;border-radius:10px;padding:12px;outline:0;font:14px monospace}textarea{min-height:280px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{border:0;border-radius:9px;padding:10px 16px;cursor:pointer;background:#111827;color:white}button.secondary{background:#eef1f5;color:#222}.result{margin-top:14px;padding:14px;background:#f6f7f9;border-radius:10px;min-height:50px;white-space:pre-wrap;word-break:break-word;font:14px monospace}@media(max-width:700px){.page{padding-left:18px;padding-right:18px}}</style></head><body><header><div class="nav"><a class="brand" href="/">✦ XTools</a><nav><a href="/">工具</a><a href="/#about">关于</a></nav></div></header><main class="page"><a class="back" href="/">← 返回工具箱</a><h1>JSON 工具</h1><p style="color:#707780">格式化、压缩与校验 JSON</p><div class="panel"><textarea id="i" placeholder='{"name":"Soly","age":18}'></textarea><div class="actions"><button onclick="fmt()">格式化</button><button onclick="mini()">压缩</button><button class="secondary" onclick="clr()">清空</button></div><div id="o" class="result"></div><script>function fmt(){try{o.textContent=JSON.stringify(JSON.parse(i.value),null,4)}catch(e){o.textContent="JSON 格式错误："+e.message}}function mini(){try{o.textContent=JSON.stringify(JSON.parse(i.value))}catch(e){o.textContent="JSON 格式错误："+e.message}}function clr(){i.value="";o.textContent=""}</script></div></main></body></html>
