<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XTools - 时间戳</title><link rel="stylesheet" href="/css/style.css"><style>.page{max-width:900px;margin:auto;padding:55px 24px 80px}.back{color:#707780;font-size:14px}.panel{margin-top:25px;background:#fff;border:1px solid #e6e8eb;border-radius:16px;padding:20px;box-shadow:0 8px 30px #1419230f}textarea,input{width:100%;border:1px solid #dfe2e6;border-radius:10px;padding:12px;outline:0;font:14px monospace}textarea{min-height:280px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{border:0;border-radius:9px;padding:10px 16px;cursor:pointer;background:#111827;color:white}button.secondary{background:#eef1f5;color:#222}.result{margin-top:14px;padding:14px;background:#f6f7f9;border-radius:10px;min-height:50px;white-space:pre-wrap;word-break:break-word;font:14px monospace}@media(max-width:700px){.page{padding-left:18px;padding-right:18px}}</style></head><body><header><div class="nav"><a class="brand" href="/">✦ XTools</a><nav><a href="/">工具</a><a href="/#about">关于</a></nav></div></header><main class="page"><a class="back" href="/">← 返回工具箱</a><h1>时间戳</h1><p style="color:#707780">Unix 时间戳与日期时间转换</p><div class="panel"><input id="i" placeholder="时间戳或日期，例如 2026-09-13 12:00:00"><div class="actions"><button onclick="now()">当前时间戳</button><button onclick="td()">时间戳 → 日期</button><button onclick="tt()">日期 → 时间戳</button></div><div id="o" class="result"></div><script>function now(){o.textContent=Math.floor(Date.now()/1000)}function td(){let n=Number(i.value);o.textContent=Number.isFinite(n)?new Date(n*1000).toLocaleString(zh-CN,{hour12:false}):请输入正确时间戳}function tt(){let d=new Date(i.value);o.textContent=isNaN(d)?请输入正确日期:Math.floor(d.getTime()/1000)}</script></div></main></body></html>
